# Nacalandia Retro Hub - Optimized Configuration Settings
# Este archivo muestra la optimización de latencia y video para Nacalandia

video_driver = "vulkan"            # Uso de Vulkan para mejor rendimiento en integradas
video_vsync = "true"               # Evita el parpadeo de imagen
video_fullscreen = "true"          # Inmersión total al lanzar desde el Hub

# Optimizaciones de Latencia (Hardcore)
video_hard_sync = "true"
video_hard_sync_frames = 0
video_frame_delay = 0

# Configuración de Shaders (Efecto Retro CRT)
video_shader_enable = "true"
video_shader = "./shaders/crt-lmask.slangp"

# Guardado automático al salir (Zero Friction)
savestate_auto_save = "true"
savestate_auto_load = "true"
