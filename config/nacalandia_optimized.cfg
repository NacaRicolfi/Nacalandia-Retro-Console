# Nacalandia Retro Hub - Performance Template
# Copia este archivo en ./emulator/retroarch.cfg

# Driver de Video: Vulkan ofrece el mejor rendimiento en GPUs integradas
video_driver = "vulkan"
video_vsync = "true"

# Reducción de Latencia (Input Lag)
video_hard_sync = "true"
video_hard_sync_frames = 0
video_frame_delay = 0

# Configuración de Audio
audio_latency = 64
audio_sync = "true"

# Mejoras Visuales
video_smooth = "false"
video_fullscreen = "true"

# Automatización (Zero Friction)
savestate_auto_save = "true"
savestate_auto_load = "true"
confirm_on_exit = "false"
